<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METRONOME</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#292e31;color:#f0f6f6;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,520px);background:#373b3e;border:1px solid #137a7f;border-radius:28px;padding:32px;box-shadow:0 24px 80px #0005}header{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.15em;color:#86cecb;text-transform:uppercase}.dot{height:9px;width:9px;border-radius:50%;background:#86cecb}h1{font-size:30px;margin:18px 0 6px}p{color:#bec8d1;line-height:1.6;margin:0 0 24px}.tempo{display:flex;justify-content:center;align-items:center;gap:22px;margin:30px 0 18px}button,input{font:inherit}button{cursor:pointer;border:1px solid #597176;color:inherit;background:#304b4e;border-radius:12px;padding:10px 17px}button:hover{filter:brightness(1.14)}button:focus-visible,input:focus-visible{outline:3px solid #86cecb;outline-offset:4px}input[type=number]{width:145px;text-align:center;border:0;background:transparent;color:#f0f6f6;font-size:64px;font-weight:650;appearance:textfield}input::-webkit-inner-spin-button{appearance:none}.unit{text-align:center;font-size:12px;letter-spacing:.16em;color:#bec8d1;margin-top:-12px}input[type=range]{width:100%;accent-color:#86cecb;margin:25px 0}.beats{display:flex;gap:12px;margin:16px 0 26px}.beat-slot{flex:1;min-width:0}.beat-slot .beat{width:100%}.mute{width:100%;margin-top:8px;padding:8px 2px;font-size:12px}.mute[aria-pressed="true"]{background:#59263e;border-color:#e12885;color:#ffd7eb}.beat-slot.muted .beat{opacity:.55}.beat{flex:1;text-align:center;padding:17px 0;background:#30464a;border:1px solid #597176;border-radius:14px;font-size:24px;font-weight:600}.beat.active{background:#86cecb;color:#17383b;border-color:#86cecb;box-shadow:0 0 26px #86cecb40}#toggle{width:100%;background:#86cecb;color:#17383b;font-weight:700;border:0;padding:16px}.row{display:flex;align-items:center;gap:16px;margin-top:16px}.row input{flex:1;margin:0}#tap{white-space:nowrap;font-size:14px}.foot{text-align:center;font-size:12px;color:#bec8d1;margin:20px 0 0}#status{min-height:22px;text-align:center;font-size:13px;margin-top:16px;color:#bec8d1}@media(max-width:420px){main{padding:24px}input[type=number]{width:120px;font-size:54px}}


/* Night palette */
:root{color-scheme:dark}
body{background:#101419;color:#dce4eb}
main{background:#1a2028;border:1px solid #34414d;box-shadow:0 20px 60px #0004}
h1{color:#cddbdc;letter-spacing:.12em;font-size:26px;font-weight:600}
header,p,.unit,.foot,#status{color:#a3b2c0}
input[type=number]{color:#e1e9ef}
button{background:#28343e;border-color:#435361;color:#dce4eb;transition:background .15s,border-color .15s}
button:hover{background:#34434f;filter:none}
button:focus-visible,input:focus-visible{outline:3px solid #81bdb7;outline-offset:4px}
input[type=range],#volume{accent-color:#81bdb7}
.beat{background:#222d37;border-color:#435361;color:#bfccd6}
.beat.active{background:#81bdb7;color:#122c2c;border-color:#81bdb7;box-shadow:0 0 16px #81bdb718}
#toggle{background:#81bdb7;color:#122c2c;box-shadow:none}
#toggle:hover{background:#94cbc5}
.mute[aria-pressed="true"]{background:#43303c;border-color:#a77e96;color:#efcfdf}
@media(max-width:420px){body{padding:16px}.row{gap:10px}#tap{padding:10px}}
</style><main><h1 style="text-align:center">METRONOME</h1><div class="tempo"><button id="minus" aria-label="Decrease BPM">−</button><input id="bpm" type="number" min="20" max="300" value="100" aria-label="Beats per minute"><button id="plus" aria-label="Increase BPM">+</button></div><div class="unit">BEATS PER MINUTE</div><input id="slider" type="range" min="20" max="300" value="100" aria-label="Tempo"><div class="beats" aria-label="Four beats"><div class="beat-slot"><div class="beat">1</div><button class="mute" data-beat="0" aria-label="Mute beat 1" aria-pressed="false">Mute</button></div><div class="beat-slot"><div class="beat">2</div><button class="mute" data-beat="1" aria-label="Mute beat 2" aria-pressed="false">Mute</button></div><div class="beat-slot"><div class="beat">3</div><button class="mute" data-beat="2" aria-label="Mute beat 3" aria-pressed="false">Mute</button></div><div class="beat-slot"><div class="beat">4</div><button class="mute" data-beat="3" aria-label="Mute beat 4" aria-pressed="false">Mute</button></div></div><button id="toggle">Start</button><div class="row"><button id="tap">Tap tempo</button><label for="volume">Volume</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.85"></div><div class="row"><label for="pitch">Pitch</label><input id="pitch" type="range" min="-12" max="12" step="1" value="0" aria-describedby="pitchValue"><output id="pitchValue" for="pitch" style="min-width:90px;text-align:right;font-size:13px">Original</output></div><div style="text-align:center;margin-top:10px"><button id="resetPitch" style="font-size:12px;padding:6px 12px">Reset pitch</button></div><div id="status" role="status">Ready when you are.</div></main>

function setPitch(value){pitch=Number(value);$('pitch').value=pitch;$('pitchValue').textContent=pitch===0?'Original':(pitch>0?'+':'')+pitch+' st';}
$('pitch').oninput=e=>setPitch(e.target.value);
$('resetPitch').onclick=()=>setPitch(0);
function setTempo(value){const n=Number(value);if(!Number.isFinite(n))return;tempo=Math.max(20,Math.min(300,Math.round(n)));$('bpm').value=$('slider').value=tempo;}
$('bpm').addEventListener('change',e=>setTempo(e.target.value));$('slider').oninput=e=>setTempo(e.target.value);
$('minus').onclick=()=>setTempo(tempo-1);$('plus').onclick=()=>setTempo(tempo+1);
$('volume').oninput=()=>{if(master)master.gain.setTargetAtTime(Number($('volume').value),ctx.currentTime,.015)};
async function init(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=Number($('volume').value);master.connect(ctx.destination)}await ctx.resume();if(!buffers)buffers=await Promise.all(recordings.map(async b64=>{const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const b=await ctx.decodeAudioData(bytes.buffer); // Remove only leading silence for consistent beat attacks.
let first=0;const channels=Array.from({length:b.numberOfChannels},(_,i)=>b.getChannelData(i));for(;first<b.length;first++){if(channels.some(c=>Math.abs(c[first])>.015))break;}first=Math.max(0,first-Math.round(.008*b.sampleRate));return {buffer:b,offset:first/b.sampleRate};}));}
function schedule(){if(!running)return;const now=ctx.currentTime;if(nextTime<now-.1){nextTime=now+.03;queue=[];}while(nextTime<now+.1){const duration=60/tempo,clip=buffers[index],source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=clip.buffer;const rate=Math.pow(2,pitch/12);source.playbackRate.value=rate;source.connect(gain);const muteGain=ctx.createGain();muteGain.gain.value=muted[index]?0:1;gain.connect(muteGain);muteGain.connect(master);const gains=beatGains[index];gains.add(muteGain); // Keep speech natural; fade it if it would run into the next beat.
const length=Math.min(duration,(clip.buffer.duration-clip.offset)/rate);gain.gain.setValueAtTime(1,nextTime);gain.gain.setValueAtTime(1,nextTime+Math.max(0,length-.012));gain.gain.linearRampToValueAtTime(0,nextTime+length);source.start(nextTime,clip.offset);source.stop(nextTime+length);sources.add(source);source.onended=()=>{sources.delete(source);source.disconnect();gain.disconnect();muteGain.disconnect();gains.delete(muteGain)};queue.push({time:nextTime,beat:index});nextTime+=duration;index=(index+1)%4;}}
function paint(){if(!running)return;let current;while(queue.length&&queue[0].time<=ctx.currentTime)current=queue.shift();if(current)beats.forEach((b,i)=>b.classList.toggle('active',i===current.beat));requestAnimationFrame(paint);}
function stop(){running=false;clearInterval(timer);for(const s of sources){try{s.stop()}catch{}}sources.clear();queue=[];beats.forEach(b=>b.classList.remove('active'));$('toggle').textContent='Start';$('status').textContent='Stopped. Next start begins at 1.';}
$('toggle').onclick=async()=>{if(loading)return;if(running){stop();return}loading=true;$('toggle').disabled=true;$('status').textContent='Preparing your recordings…';try{setTempo($('bpm').value);await init();running=true;index=0;queue=[];nextTime=ctx.currentTime+.06;$('toggle').textContent='Stop';$('status').textContent='Counting in 4 · Change the tempo any time.';schedule();timer=setInterval(schedule,25);paint();}catch(e){stop();$('status').textContent='Audio could not start. Open this file in a current browser and try again.';console.error(e)}finally{loading=false;$('toggle').disabled=false}};
$('tap').onclick=()=>{const now=performance.now();if(taps.length&&now-taps.at(-1)>3000)taps=[];taps.push(now);if(taps.length>6)taps.shift();if(taps.length>1)setTempo(60000/((taps.at(-1)-taps[0])/(taps.length-1)));};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();$('toggle').click()}});
ctx?.addEventListener('statechange',()=>{});
window.addEventListener('pagehide',()=>{if(running)stop()});
</script></html>
